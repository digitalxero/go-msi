name: Test & Release

# Pull requests are covered by ci.yml; this workflow only runs on main, where
# the release job can actually publish. Running it on PRs too duplicated every
# test and windows-patch check for a release step that is always skipped.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: [validation]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install svu
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          go install github.com/goreleaser/chglog/cmd/chglog@v0.7.4

      - name: Determine version
        id: version
        run: |
          CURRENT=$(svu current)
          NEXT=$(svu next)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$NEXT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No version bump needed ($CURRENT)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version bump: $CURRENT -> $NEXT"
          fi

      - name: Create tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .repo-policy/release.py changelog
          chglog format --template release --output release-notes.md
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"
          gh release create "${{ steps.version.outputs.next }}" --notes-file release-notes.md
